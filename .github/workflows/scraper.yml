name: Napi Allasszinkronizacio

on:
  schedule:
    # 🕒 Figyelem: A cron UTC időzónában fut! 
    # UTC 02:00 = Magyarországon (CET) télen 03:00, nyáron (CEST) 04:00.
    - cron: '0 2 * * *'
  workflow_dispatch:

# 🛑 Konkurencia védelem: Megakadályozza, hogy két scraper egyszerre fusson
concurrency:
  group: scraper-pipeline
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    # 🔐 Kifejezett írási jog a GitHub Actions számára, hogy fel tudja tölteni a JSON-t
    permissions:
      contents: write
    
    # ⏱️ Költség- és Végtelen ciklus védelem (Hard Limit)
    timeout-minutes: 35 

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # ⚡ Csomagok gyorsítótárazása

      - name: 📦 Install dependencies
        # Ha van package.json, ez a legbiztonságosabb telepítés
        run: npm ci 

      - name: 🚀 Run UniStart scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TZ: 'Europe/Budapest'
        # A fő vezérlő fájl futtatása (a kódod alapján scraper.js-nek hívtuk)
        run: node scraper.js

      - name: 💾 Friss jobs.json feltöltése a GitHubra
        run: |
          git config --global user.name 'UniStart Bot'
          git config --global user.email 'bot@unistart.hu'
          git add jobs.json
          # A [skip ci] megakadályozza az Action esetleges végtelen újraindulását
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Automatikus állás frissítés [skip ci]" && git push)

      - name: 🚨 Vészjelzés küldése Discordra/Slackre (Csak ha Hiba történt)
        # Ez a lépés csak akkor fut le, ha a korábbiak közül valamelyik elhasalt
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -H "Content-Type: application/json" \
            -d '{"content": "🚨 **KRITIKUS HIBA:** A napi GitHub Actions scraper (UniStart) összeomlott vagy időtúllépést okozott! Kérlek, nézd meg a logokat a GitHubon."}' \
            $DISCORD_WEBHOOK_URL
          fi