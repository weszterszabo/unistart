name: 🚀 Omni-Sentient Scraper & AI Training

on:
  schedule:
    # ---------------------------------------------------------------------------------
    # VÁLASZD KI AZ IDEÁLIS TEMPÓT (Most a 2 óránkénti van beállítva):
    # - cron: '*/30 * * * *'       <-- Félóránként (NEM AJÁNLOTT, tiltást okozhat!)
    # - cron: '0 */2 * * *'        <-- Minden 2. órában (Intenzív Tréning, napi 12x)
    # - cron: '0 */4 * * *'        <-- Minden 4. órában (A Legjobb Balansz, napi 6x)
    # - cron: '0 6,12,18,22 * * *' <-- Napi 4x célzottan (Reggel, Délben, Este, Éjjel)
    # ---------------------------------------------------------------------------------
    - cron: '0 */2 * * *'
  workflow_dispatch: 

jobs:
  scrape_and_train:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: 📥 Kód és AI Memória letöltése
        uses: actions/checkout@v4

      - name: 🟢 Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Függőségek telepítése
        run: npm install cheerio firebase-admin

      - name: 🧠 Scraper futtatása és AI Tréning
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: node scraper.js

      - name: 💾 AI Memória és Eredmények mentése (Auto-Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add jobs.json brain.json AI_TUDASBAZIS_JAVASLATOK.md kiszurt_allasok.txt
          
          git commit -m "🤖 AI Intenzív Tanulás & Adatbázis Frissítés [skip ci]" || echo "Nincs új megtanult adat, nincs mit menteni."
          git push