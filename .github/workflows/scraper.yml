name: 🚀 Omni-Sentient Scraper & AI Training

on:
  schedule:
    # Minden hajnalban 3:00-kor fut le (UTC idő szerint)
    - cron: '0 3 * * *'
  workflow_dispatch: 
    # Ez tesz be egy "Run workflow" gombot a GitHubra, hogy kézzel is el tudd indítani!

jobs:
  scrape_and_train:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Szükséges, hogy a robot tudjon pusholni a repódba!

    steps:
      - name: 📥 Kód és AI Memória letöltése
        uses: actions/checkout@v4

      - name: 🟢 Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Függőségek telepítése
        # Csak azokat a csomagokat telepíti, amik kellenek a scrapernek és az analyzernek
        run: npm install cheerio firebase-admin

      - name: 🧠 Scraper futtatása és AI Tréning
        env:
          # A Firebase kulcsot biztonságosan adjuk át (lásd 2. lépés)
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: node scraper.js

      - name: 💾 AI Memória és Eredmények mentése (Auto-Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Hozzáadjuk a megváltozott fájlokat (az AI agyát és a kimenetet)
          git add jobs.json brain.json AI_TUDASBAZIS_JAVASLATOK.md kiszurt_allasok.txt
          
          # A [skip ci] fontos, hogy a push ne indítson el egy végtelen láncreakciót!
          git commit -m "🤖 AI Napi Tanulás & Adatbázis Frissítés [skip ci]" || echo "Nincs új megtanult adat, nincs mit menteni."
          git push